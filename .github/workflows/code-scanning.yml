name: LLMSafe Code Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      sarif-file: ${{ steps.llmsafe.outputs.sarif-file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - id: llmsafe
        name: Generate SARIF
        continue-on-error: true
        uses: ./
        with:
          path: .
          fail-on: high
          sarif-file: llmsafe.sarif
      - name: Stage SARIF for the isolated upload job
        if: always() && steps.llmsafe.outputs.sarif-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llmsafe-sarif
          path: llmsafe.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Enforce LLMSafe exit code
        if: steps.llmsafe.outputs.exit-code != '0'
        run: exit 1

  upload:
    needs: scan
    if: >-
      always() &&
      needs.scan.outputs.sarif-file != '' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llmsafe-sarif
          path: reports
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: reports/llmsafe.sarif
          category: llmsafe
