name: LLMSafe Code Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    outputs:
      sarif-file: ${{ steps.llmsafe.outputs.sarif-file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - id: llmsafe
        name: Generate SARIF
        continue-on-error: true
        uses: ./
        with:
          path: .
          fail-on: high
          sarif-file: llmsafe.sarif
      - name: Stage SARIF for the isolated upload job
        if: always() && steps.llmsafe.outputs.sarif-file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmsafe-sarif
          path: llmsafe.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Enforce LLMSafe exit code
        if: steps.llmsafe.outputs.exit-code != '0'
        run: exit 1

  upload:
    needs: scan
    if: >-
      always() &&
      needs.scan.outputs.sarif-file != '' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llmsafe-sarif
          path: reports
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: reports/llmsafe.sarif
          category: llmsafe
