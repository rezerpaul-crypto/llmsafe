name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Run the contributor workflow
        run: python scripts/dev.py --current

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Test the built wheel
        run: |
          python -m venv /tmp/llmsafe-package-test
          /tmp/llmsafe-package-test/bin/python -m pip install dist/*.whl
          /tmp/llmsafe-package-test/bin/llmsafe --version

  action:
    name: Composite action contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - id: llmsafe
        uses: ./
        with:
          path: llmsafe
          fail-on: high
          sarif-file: /tmp/llmsafe-action.sarif
      - name: Verify action outputs and SARIF
        env:
          LLMSAFE_EXIT_CODE: ${{ steps.llmsafe.outputs.exit-code }}
          LLMSAFE_SARIF_FILE: ${{ steps.llmsafe.outputs.sarif-file }}
        run: |
          test "$LLMSAFE_EXIT_CODE" = "0"
          test "$LLMSAFE_SARIF_FILE" = "/tmp/llmsafe-action.sarif"
          python -c "import json; json.load(open('/tmp/llmsafe-action.sarif'))"
