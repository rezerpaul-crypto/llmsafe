version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-development-dependencies:
        dependency-type: development
    ignore:
      # pytest 9 requires Python 3.10. Keep major 9 updates out of grouped
      # development PRs while LLMSafe supports and tests Python 3.9.
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
