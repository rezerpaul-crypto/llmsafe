version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-development-dependencies:
        dependency-type: development
    ignore:
      # pytest 9 requires Python 3.10. An explicit version boundary is used
      # because a semver-major ignore does not constrain the open-ended
      # pytest>=7.4 development requirement inside a grouped update.
      - dependency-name: pytest
        versions: [">=9"]
      # Setuptools is also the build backend for supported Python 3.9 installs.
      # Hold major updates until their declared Python floor remains compatible.
      - dependency-name: setuptools
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
