name: LLMSafe Security Scan
description: Scan AI and agentic application code and produce SARIF 2.1.0.
author: LLMSafe contributors

branding:
  icon: shield
  color: purple

inputs:
  path:
    description: File or directory to scan.
    required: false
    default: .
  fail-on:
    description: Minimum severity that makes the action fail.
    required: false
    default: high
  config:
    description: Optional path to an LLMSafe TOML policy.
    required: false
    default: ""
  baseline:
    description: Optional path to a reviewed LLMSafe baseline JSON file.
    required: false
    default: ""
  sarif-file:
    description: Destination for the generated SARIF report.
    required: false
    default: llmsafe.sarif

outputs:
  sarif-file:
    description: Path to the generated SARIF report, or empty when validation failed before scanning.
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: LLMSafe process exit code (0 clean, 1 policy finding, 2 usage/configuration error).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install LLMSafe
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Scan
      id: scan
      shell: bash
      env:
        LLMSAFE_INPUT_BASELINE: ${{ inputs.baseline }}
        LLMSAFE_INPUT_CONFIG: ${{ inputs.config }}
        LLMSAFE_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        LLMSAFE_INPUT_PATH: ${{ inputs.path }}
        LLMSAFE_INPUT_SARIF: ${{ inputs.sarif-file }}
      run: bash "${{ github.action_path }}/scripts/run-action.sh"
