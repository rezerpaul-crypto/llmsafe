<script>
  /* before first paint: remember theme, flag that scripting is available */
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    var t = null;
    try { t = localStorage.getItem('lj-theme'); } catch (e) { /* storage blocked */ }
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.dataset.theme = t;
  })();
</script>
