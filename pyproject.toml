[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsafe"
version = "0.3.0rc1"
description = "Static security scanner for Python AI agents, LLM apps, and MCP servers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LLMSafe contributors" }]
keywords = ["ai", "agents", "llm", "mcp", "security", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
  "twine>=7.0.0",
]

[project.scripts]
llmsafe = "llmsafe.cli:main"

[project.urls]
Homepage = "https://github.com/rezerpaul-crypto/llmsafe"
Documentation = "https://github.com/rezerpaul-crypto/llmsafe/tree/main/docs"
Source = "https://github.com/rezerpaul-crypto/llmsafe"
Changelog = "https://github.com/rezerpaul-crypto/llmsafe/blob/main/CHANGELOG.md"
Issues = "https://github.com/rezerpaul-crypto/llmsafe/issues"

[tool.setuptools.packages.find]
include = ["benchmarks*", "llmsafe*"]

[tool.setuptools.package-data]
benchmarks = ["manifest.json", "cases/*.json", "cases/*.py"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llmsafe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
